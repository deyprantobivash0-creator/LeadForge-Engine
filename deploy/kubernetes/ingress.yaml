{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "leadforge",
    "annotations": {
      "kubernetes.io/ingress.class": "leadforge-local",
      "traefik.ingress.kubernetes.io/router.entrypoints": "websecure",
      "traefik.ingress.kubernetes.io/router.tls": "true"
    }
  },
  "spec": {
    "tls": [
      {
        "hosts": [
          "staging.leadforge.test"
        ],
        "secretName": "leadforge-local-tls"
      }
    ],
    "rules": [
      {
        "host": "staging.leadforge.test",
        "http": {
          "paths": [
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "frontend",
                  "port": {
                    "number": 8080
                  }
                }
              }
            }
          ]
        }
      }
    ]
  }
}
