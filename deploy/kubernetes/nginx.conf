worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_x_request_id $correlation_id {
        default $request_id;
        "~^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" $http_x_request_id;
    }
    map $uri $log_path {
        default "<spa>";
        ~^/api(?:/|$) "/api";
        /health "/health";
        /ready "/ready";
        ~^/assets/ "/assets";
    }
    log_format operational escape=json '{"timestamp":"$time_iso8601","service":"leadforge-nginx","event":"proxy.request.completed","request_id":"$correlation_id","method":"$request_method","path":"$log_path","status_code":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';
    access_log /dev/stdout operational;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker DNS; re-resolve after backend container replacement.
    resolver kube-dns.kube-system.svc.cluster.local valid=5s ipv6=off;
    resolver_timeout 2s;

    server {
        listen 8080;
        server_name staging.leadforge.test;
        if ($host != "staging.leadforge.test") { return 400; }
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;
        include /etc/nginx/security-headers.conf;
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|OPTIONS)$) { return 405; }

        location = /frontend-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        location ~ ^/(api(?:/|$)|health$|ready$) {
            set $backend http://backend.leadforge-local.svc.cluster.local:8000;
            proxy_pass $backend$request_uri;
            proxy_redirect http://$http_host/ https://$http_host/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_hide_header X-Request-ID;
            include /etc/nginx/security-headers.conf;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Cache-Control;
            # Do not trust forwarded headers supplied by the browser.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            add_header Cache-Control "no-store" always;
        }

        location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
        location ~ ^/(docs|redoc|openapi\.json)$ { return 404; }
        location /assets/ {
            try_files $uri =404;
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
        }
    }
}
