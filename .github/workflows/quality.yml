name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AI_PROVIDER: mock
  ENVIRONMENT: development
  DATABASE_URL: 'sqlite:///:memory:'
  LEADFORGE_ENV_FILE: ''
  LEADFORGE_CI: '1'
  LANGSMITH_TRACING: 'false'
  LANGCHAIN_TRACING_V2: 'false'
  CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci.py backend
      - run: python scripts/ci.py hygiene

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: leadforge_dev
          POSTGRES_PASSWORD: leadforge_dev_only
          POSTGRES_DB: leadforge_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U leadforge_dev -d leadforge_dev"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      LEADFORGE_POSTGRES_ADMIN_URL: postgresql+psycopg://leadforge_dev:leadforge_dev_only@127.0.0.1:55432/leadforge_dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/ci.py postgres

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements-dev.txt -r requirements-ci.txt
      - run: npm ci
        working-directory: frontend
      - run: python scripts/ci.py security
      - run: python scripts/ci.py secrets

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python scripts/ci.py containers

  quality-gate:
    if: ${{ always() }}
    needs: [backend, postgres, frontend, security, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every mandatory job to succeed
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Quality gate failed: ' + ', '.join(failed))
          print('All mandatory quality gates passed')
          PY
